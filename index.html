<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/10479/10479879.png" type="image/x-icon">
    <title>Vitrine de Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="title-container">
        <h1>Vitrine de Produtos</h1>
        <button id="fullscreen-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-maximize"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
            Tela Cheia
        </button>
    </div>
    <div id="app">
        <div id="customization" class="horizontal-customization">
            <h2>Personalização</h2>
            <div class="customization-column">
                <h3>Nome do Produto</h3>
                <div class="form-group">
                    <label for="product-name-color">Cor:</label>
                    <input type="color" id="product-name-color" value="#ffffff">
                </div>
                <div class="form-group">
                    <label for="product-name-font-size">Tamanho da Fonte (px):</label>
                    <input type="number" id="product-name-font-size" value="28" min="10" max="100">
                </div>
            </div>
            <div class="customization-column">
                <h3>Preço do Produto</h3>
                <div class="form-group">
                    <label for="product-price-color">Cor:</label>
                    <input type="color" id="product-price-color" value="#ffffff">
                </div>
                <div class="form-group">
                    <label for="product-price-bg-color">Cor de Fundo:</label>
                    <input type="color" id="product-price-bg-color" value="#1a73e8">
                </div>
                <div class="form-group">
                    <label for="product-price-font-size">Tamanho da Fonte (px):</label>
                    <input type="number" id="product-price-font-size" value="24" min="10" max="100">
                </div>
            </div>
            <div class="customization-column">
                <h3>Fundo (Tela Cheia)</h3>
                <div class="form-group">
                    <label for="background-color">Cor de Fundo:</label>
                    <input type="color" id="background-color" value="#ffffff">
                </div>
                <div class="form-group">
                    <label for="background-image">Imagem de Fundo:</label>
                    <input type="file" id="background-image" accept="image/*">
                </div>
            </div>
            <div class="customization-column">
                <h3>Carrossel</h3>
                <div class="form-group">
                    <label for="carousel-speed">Velocidade (s):</label>
                    <input type="number" id="carousel-speed" value="3" step="0.1">
                </div>
            </div>
        </div>

        <div id="carousel-container">
            <div id="carousel"></div>
        </div>

        <div id="product-management">
            <h2>Gerenciamento de Produtos</h2>
            <form id="product-form">
                <input type="hidden" id="product-id">
                <input type="text" id="product-name" placeholder="Nome do Produto" required>
                <input type="number" id="product-price" placeholder="Preço" step="0.01" required>
                <input type="file" id="product-image" accept="image/*" required>
                <button type="submit">Salvar Produto</button>
            </form>
            <div id="product-list"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
